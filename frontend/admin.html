<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AHS RAMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AHS RAMS">
<meta name="theme-color" content="#4bbfd6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2048%2048'%20fill%3D'none'%3E%3Ccircle%20cx%3D'21'%20cy%3D'20'%20r%3D'16.5'%20stroke%3D'%234bbfd6'%20stroke-width%3D'2.3'%2F%3E%3Ccircle%20cx%3D'21'%20cy%3D'20'%20r%3D'9.5'%20stroke%3D'%234bbfd6'%20stroke-width%3D'2.3'%2F%3E%3Cline%20x1%3D'21'%20y1%3D'20'%20x2%3D'40'%20y2%3D'8'%20stroke%3D'%238b9096'%20stroke-width%3D'2.3'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#4bbfd6;--accent-dark:#3E9DAF;--accent-light:#E4F5F9;--primary:#757575;
    --bg:#F8FAFC;--surface:#ffffff;--text:#111827;--text-muted:#6B7280;--border:#E5E7EB;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .header{background:var(--surface);border-bottom:3px solid var(--accent);color:var(--text);padding:14px 30px;display:flex;justify-content:space-between;align-items:center}
  .header-brand{display:flex;align-items:center;gap:12px}
  .header-brand .mark{width:40px;height:40px;flex-shrink:0}
  .header-brand .mark svg{width:100%;height:100%}
  .header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .header h1 em{font-style:italic;font-weight:600}
  .header .sub{font-size:12px;color:var(--text-muted)}
  .header .actions a,.header .actions button{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:0;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-left:8px}
  .header .actions a:hover,.header .actions button:hover{border-color:var(--accent);color:var(--text)}
  .container{max-width:1100px;margin:0 auto;padding:24px 30px}
  .card{background:var(--surface);padding:24px;margin-bottom:18px;border:1px solid var(--border)}
  .card h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .form-row{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:10px;align-items:end}
  label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:4px;display:block}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--border);background:var(--bg);font-family:inherit;font-size:13px;color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-light)}
  button{padding:9px 16px;background:var(--accent);color:var(--primary);border:none;border-radius:0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent-dark);color:#fff}
  button.red{background:#b91c1c;color:#fff}
  button.red:hover{background:#991b1b}
  button.amber{background:#b45309;color:#fff}
  button.amber:hover{background:#92400e}
  button.small{padding:5px 10px;font-size:11px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px}
  th{font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:0;font-size:11px;font-weight:600}
  .badge.ok{background:#e8f7ef;color:#1a7a4a}
  .badge.off{background:#fee2e2;color:#b91c1c}
  .badge.admin{background:var(--accent-light);color:#2b7a8c}
  .msg{padding:10px;border:1px solid transparent;font-size:13px;margin-top:10px;display:none}
  .msg.ok{background:#e8f7ef;border-color:#a7e3c0;color:#1a7a4a;display:block}
  .msg.err{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;display:block}
  /* Show/hide eye inside a password box (pw-eye.js), and the Password column */
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:42px}
  button.pw-eye{position:absolute;top:0;right:0;bottom:0;width:40px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text-muted);cursor:pointer}
  button.pw-eye:hover{background:transparent;color:var(--accent-dark)}
  button.pw-eye:focus-visible,button.pw-view:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  button.pw-eye svg,button.pw-view svg{width:18px;height:18px}
  .pw-cell{display:flex;align-items:center;gap:6px;min-width:150px}
  .pw-val{font-size:13px;letter-spacing:.08em;color:var(--text-muted)}
  .pw-val.shown{font-family:ui-monospace,Consolas,monospace;letter-spacing:0;color:var(--text);user-select:all;word-break:break-all}
  .pw-none{font-size:12px;color:var(--text-muted)}
  button.pw-view{width:36px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--text-muted);flex-shrink:0}
  button.pw-view:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark)}
  tr.setpw-row td{background:var(--accent-light);border-bottom:1px solid var(--accent)}
  .setpw-form{display:flex;flex-wrap:wrap;align-items:end;gap:10px}
  .setpw-form .field{flex:1 1 260px;max-width:380px}
  button.ghost{background:var(--surface);color:var(--text-muted);border:1px solid var(--border)}
  button.ghost:hover{background:var(--surface);color:var(--text);border-color:var(--accent)}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <div class="mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="20" r="16.5" stroke="var(--accent)" stroke-width="2.3"/><circle cx="21" cy="20" r="9.5" stroke="var(--accent)" stroke-width="2.3"/><line x1="21" y1="20" x2="40" y2="8" stroke="#8b9096" stroke-width="2.3" stroke-linecap="round"/></svg></div>
      <div>
        <h1><strong>AHS</strong> <em>RAMS</em></h1>
        <div class="sub">User administration</div>
      </div>
    </div>
    <div class="actions">
      <a href="oprams.html">App</a>
      <button id="logout">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Create a user</h2>
      <form class="form-row" id="create-form">
        <div>
          <label for="new-email">Email</label>
          <input type="email" id="new-email" required>
        </div>
        <div>
          <label for="new-password">Password (min 12 chars)</label>
          <div class="pw-wrap">
            <input type="password" id="new-password" minlength="12" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-pw-eye aria-label="Show password"></button>
          </div>
        </div>
        <div>
          <label for="new-role">Role</label>
          <select id="new-role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label for="new-expiry">Access expires (optional)</label>
          <input type="date" id="new-expiry">
        </div>
        <button type="submit">Create</button>
      </form>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <div class="table-scroll">
      <table id="users-table">
        <thead><tr>
          <th>Email</th><th>Role</th><th>Status</th><th>Password</th><th>Access expires</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <div class="msg" id="users-msg"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="pw-eye.js"></script>
  <script>
    let currentUser = null;

    async function bootstrap() {
      try {
        const { user } = await window.api.me();
        if (user.role !== 'admin') { window.location.href = 'oprams.html'; return; }
        currentUser = user;
        await loadUsers();
      } catch {
        window.location.href = 'index.html';
      }
    }

    // Passwords on screen: shown on request, hidden again after 30 seconds.
    const PW_DOTS = '••••••••••';
    const PW_SHOW_MS = 30000;
    const NOT_STORED = 'Not stored, reset to set';
    const pwTimers = new Map();

    function hidePassword(id) {
      clearTimeout(pwTimers.get(id)); pwTimers.delete(id);
      const val = document.querySelector(`.pw-val[data-id="${id}"]`);
      const btn = document.querySelector(`button.pw-view[data-id="${id}"]`);
      if (val) { val.textContent = PW_DOTS; val.classList.remove('shown'); }
      if (btn) { btn.innerHTML = window.pwEye.icons.show; btn.setAttribute('aria-label', 'Show password'); btn.title = 'Show password'; btn.setAttribute('aria-pressed', 'false'); }
    }

    async function showPassword(id) {
      const val = document.querySelector(`.pw-val[data-id="${id}"]`);
      const btn = document.querySelector(`button.pw-view[data-id="${id}"]`);
      if (!val || !btn) return;
      btn.disabled = true;
      try {
        const { password } = await window.api.getUserPassword(id);
        if (password === null || password === undefined) {
          val.closest('.pw-cell').innerHTML = `<span class="pw-none">${NOT_STORED}</span>`;
          return;
        }
        val.textContent = password;
        val.classList.add('shown');
        btn.innerHTML = window.pwEye.icons.hide; btn.setAttribute('aria-label', 'Hide password'); btn.title = 'Hide password'; btn.setAttribute('aria-pressed', 'true');
        clearTimeout(pwTimers.get(id));
        pwTimers.set(id, setTimeout(() => hidePassword(id), PW_SHOW_MS));
      } finally {
        btn.disabled = false;
      }
    }

    function passwordCell(u) {
      if (!u.password_stored) return `<span class="pw-none">${NOT_STORED}</span>`;
      return `<div class="pw-cell"><span class="pw-val" data-id="${u.id}">${PW_DOTS}</span>`
        + `<button type="button" class="pw-view" data-action="view-pw" data-id="${u.id}" aria-label="Show password" title="Show password" aria-pressed="false">${window.pwEye.icons.show}</button></div>`;
    }

    async function loadUsers() {
      pwTimers.forEach((t) => clearTimeout(t)); pwTimers.clear();
      const { users } = await window.api.listUsers();
      const tbody = document.querySelector('#users-table tbody');
      tbody.innerHTML = '';
      users.forEach((u) => {
        const tr = document.createElement('tr');
        tr.dataset.id = u.id;
        const expiry = u.access_expires_at ? new Date(u.access_expires_at).toLocaleDateString() : '—';
        tr.innerHTML = `
          <td>${escapeHtml(u.email)}</td>
          <td><span class="badge ${u.role === 'admin' ? 'admin' : ''}">${u.role}</span></td>
          <td><span class="badge ${u.is_active ? 'ok' : 'off'}">${u.is_active ? 'active' : 'inactive'}</span></td>
          <td>${passwordCell(u)}</td>
          <td>
            <input type="date" class="expiry-input" data-id="${u.id}" value="${u.access_expires_at ? u.access_expires_at.slice(0,10) : ''}" style="width:150px">
            <button class="small" data-action="save-expiry" data-id="${u.id}">Save</button>
          </td>
          <td>
            <button class="small" data-action="set-pw" data-id="${u.id}" data-email="${escapeHtml(u.email)}">Set password</button>
            <button class="small amber" data-action="revoke" data-id="${u.id}">Revoke sessions</button>
            ${u.is_active ? '' : `<button class="small" data-action="reactivate" data-id="${u.id}">Reactivate</button>`}
            <button class="small red" data-action="delete" data-id="${u.id}" data-email="${escapeHtml(u.email)}" ${u.id === currentUser.id ? 'disabled' : ''}>Delete</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    // Set password: one inline form under the user's row.
    function closeSetPassword() {
      document.querySelectorAll('tr.setpw-row').forEach((r) => r.remove());
    }

    function openSetPassword(id, email) {
      closeSetPassword();
      const row = document.querySelector(`#users-table tbody tr[data-id="${id}"]`);
      if (!row) return;
      const tr = document.createElement('tr');
      tr.className = 'setpw-row';
      tr.innerHTML = `<td colspan="6">
          <form class="setpw-form" data-id="${id}" data-email="${escapeHtml(email)}">
            <div class="field">
              <label for="setpw-input">New password for <span style="text-transform:none">${escapeHtml(email)}</span> (min 12 chars)</label>
              <div class="pw-wrap">
                <input type="password" id="setpw-input" minlength="12" autocomplete="new-password" required>
                <button type="button" class="pw-eye" data-pw-eye aria-label="Show password"></button>
              </div>
            </div>
            <button type="submit">Save password</button>
            <button type="button" class="ghost" data-action="cancel-pw">Cancel</button>
          </form>
          <div class="msg" id="setpw-msg"></div>
        </td>`;
      row.after(tr);
      window.pwEye.wire(tr);
      tr.querySelector('input').focus();
    }

    document.querySelector('#users-table').addEventListener('submit', async (e) => {
      const form = e.target.closest('form.setpw-form');
      if (!form) return;
      e.preventDefault();
      const id = form.dataset.id;
      const email = form.dataset.email;
      const input = form.querySelector('input');
      const msg = document.getElementById('setpw-msg');
      const password = input.value;
      if (password.length < 12) {
        msg.className = 'msg err'; msg.textContent = 'The password must be at least 12 characters.';
        return;
      }
      const self = currentUser && id === currentUser.id;
      if (self && !confirm('This signs you out of every session, including this one.\n\nNote: the admin password is set back to the server\'s ADMIN_PASSWORD setting each time the app is redeployed.')) return;
      const saveBtn = form.querySelector('button[type="submit"]');
      saveBtn.disabled = true;
      try {
        await window.api.updateUser(id, { password });
        input.value = '';
        if (self) { window.location.href = 'index.html'; return; }
        await loadUsers();
        const done = document.getElementById('users-msg');
        done.className = 'msg ok';
        done.textContent = `Password set for ${email}. They have been signed out and need the new password to sign in.`;
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = err.message;
      } finally {
        saveBtn.disabled = false;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('create-msg');
      msg.className = 'msg'; msg.textContent = '';
      try {
        const email = document.getElementById('new-email').value.trim();
        const password = document.getElementById('new-password').value;
        const role = document.getElementById('new-role').value;
        const expiry = document.getElementById('new-expiry').value;
        await window.api.createUser({
          email, password, role,
          accessExpiresAt: expiry ? new Date(expiry + 'T23:59:59').toISOString() : null,
        });
        msg.className = 'msg ok'; msg.textContent = 'User created.';
        e.target.reset();
        window.pwEye.hideAll(e.target);
        await loadUsers();
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = err.message;
      }
    });

    document.querySelector('#users-table').addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      // Buttons without an action (the eye in a box, Save password) are handled elsewhere,
      // and must not reload the table under an open form.
      if (!action) return;
      if (action === 'view-pw') {
        if (btn.getAttribute('aria-pressed') === 'true') hidePassword(id);
        else await showPassword(id).catch((err) => alert(err.message));
        return;
      }
      if (action === 'set-pw') { openSetPassword(id, btn.dataset.email); return; }
      if (action === 'cancel-pw') { closeSetPassword(); return; }
      try {
        if (action === 'revoke') {
          if (!confirm('Kick this user out of all active sessions?')) return;
          await window.api.revokeSessions(id);
        } else if (action === 'delete') {
          const email = btn.dataset.email || 'this user';
          const warning =
            'Permanently delete ' + email + '?\n\n' +
            'This CANNOT be undone. The user will be logged out, their account will be removed, ' +
            'and ALL of their saved RAMS records will be deleted.\n\n' +
            'Their email address will become free for re-use.';
          if (!confirm(warning)) return;
          await window.api.deleteUser(id);
        } else if (action === 'reactivate') {
          await window.api.updateUser(id, { isActive: true });
        } else if (action === 'save-expiry') {
          const input = document.querySelector(`.expiry-input[data-id="${id}"]`);
          const value = input.value;
          await window.api.updateUser(id, {
            accessExpiresAt: value ? new Date(value + 'T23:59:59').toISOString() : null,
          });
        }
        await loadUsers();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await window.api.logout().catch(() => {});
      window.location.href = 'index.html';
    });

    bootstrap();
  </script>
</body>
</html>
