<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AHS RAMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AHS RAMS">
<meta name="theme-color" content="#4bbfd6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2048%2048'%20fill%3D'none'%3E%3Ccircle%20cx%3D'21'%20cy%3D'20'%20r%3D'16.5'%20stroke%3D'%234bbfd6'%20stroke-width%3D'2.3'%2F%3E%3Ccircle%20cx%3D'21'%20cy%3D'20'%20r%3D'9.5'%20stroke%3D'%234bbfd6'%20stroke-width%3D'2.3'%2F%3E%3Cline%20x1%3D'21'%20y1%3D'20'%20x2%3D'40'%20y2%3D'8'%20stroke%3D'%238b9096'%20stroke-width%3D'2.3'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#4bbfd6;--accent-dark:#3E9DAF;--accent-light:#E4F5F9;--primary:#757575;
    --bg:#F8FAFC;--surface:#ffffff;--text:#111827;--text-muted:#6B7280;--border:#E5E7EB;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .header{background:var(--surface);border-bottom:3px solid var(--accent);color:var(--text);padding:14px 30px;display:flex;justify-content:space-between;align-items:center}
  .header-brand{display:flex;align-items:center;gap:12px}
  .header-brand .mark{width:40px;height:40px;flex-shrink:0}
  .header-brand .mark svg{width:100%;height:100%}
  .header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .header h1 em{font-style:italic;font-weight:600}
  .header .sub{font-size:12px;color:var(--text-muted)}
  .header .actions a,.header .actions button{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:0;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-left:8px}
  .header .actions a:hover,.header .actions button:hover{border-color:var(--accent);color:var(--text)}
  .container{max-width:1100px;margin:0 auto;padding:24px 30px}
  .card{background:var(--surface);padding:24px;margin-bottom:18px;border:1px solid var(--border)}
  .card h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .form-row{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:10px;align-items:end}
  label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:4px;display:block}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--border);background:var(--bg);font-family:inherit;font-size:13px;color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-light)}
  button{padding:9px 16px;background:var(--accent);color:var(--primary);border:none;border-radius:0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent-dark);color:#fff}
  button.red{background:#b91c1c;color:#fff}
  button.red:hover{background:#991b1b}
  button.amber{background:#b45309;color:#fff}
  button.amber:hover{background:#92400e}
  button.small{padding:5px 10px;font-size:11px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px}
  th{font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:0;font-size:11px;font-weight:600}
  .badge.ok{background:#e8f7ef;color:#1a7a4a}
  .badge.off{background:#fee2e2;color:#b91c1c}
  .badge.admin{background:var(--accent-light);color:#2b7a8c}
  .msg{padding:10px;border:1px solid transparent;font-size:13px;margin-top:10px;display:none}
  .msg.ok{background:#e8f7ef;border-color:#a7e3c0;color:#1a7a4a;display:block}
  .msg.err{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;display:block}
</style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <div class="mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="20" r="16.5" stroke="var(--accent)" stroke-width="2.3"/><circle cx="21" cy="20" r="9.5" stroke="var(--accent)" stroke-width="2.3"/><line x1="21" y1="20" x2="40" y2="8" stroke="#8b9096" stroke-width="2.3" stroke-linecap="round"/></svg></div>
      <div>
        <h1><strong>AHS</strong> <em>RAMS</em></h1>
        <div class="sub">User administration</div>
      </div>
    </div>
    <div class="actions">
      <a href="oprams.html">App</a>
      <button id="logout">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Create a user</h2>
      <form class="form-row" id="create-form">
        <div>
          <label for="new-email">Email</label>
          <input type="email" id="new-email" required>
        </div>
        <div>
          <label for="new-password">Password (min 12 chars)</label>
          <input type="password" id="new-password" minlength="12" required>
        </div>
        <div>
          <label for="new-role">Role</label>
          <select id="new-role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label for="new-expiry">Access expires (optional)</label>
          <input type="date" id="new-expiry">
        </div>
        <button type="submit">Create</button>
      </form>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <table id="users-table">
        <thead><tr>
          <th>Email</th><th>Role</th><th>Status</th><th>Access expires</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    let currentUser = null;

    async function bootstrap() {
      try {
        const { user } = await window.api.me();
        if (user.role !== 'admin') { window.location.href = 'oprams.html'; return; }
        currentUser = user;
        await loadUsers();
      } catch {
        window.location.href = 'index.html';
      }
    }

    async function loadUsers() {
      const { users } = await window.api.listUsers();
      const tbody = document.querySelector('#users-table tbody');
      tbody.innerHTML = '';
      users.forEach((u) => {
        const tr = document.createElement('tr');
        const expiry = u.access_expires_at ? new Date(u.access_expires_at).toLocaleDateString() : '—';
        tr.innerHTML = `
          <td>${escapeHtml(u.email)}</td>
          <td><span class="badge ${u.role === 'admin' ? 'admin' : ''}">${u.role}</span></td>
          <td><span class="badge ${u.is_active ? 'ok' : 'off'}">${u.is_active ? 'active' : 'inactive'}</span></td>
          <td>
            <input type="date" class="expiry-input" data-id="${u.id}" value="${u.access_expires_at ? u.access_expires_at.slice(0,10) : ''}" style="width:150px">
            <button class="small" data-action="save-expiry" data-id="${u.id}">Save</button>
          </td>
          <td>
            <button class="small amber" data-action="revoke" data-id="${u.id}">Revoke sessions</button>
            ${u.is_active ? '' : `<button class="small" data-action="reactivate" data-id="${u.id}">Reactivate</button>`}
            <button class="small red" data-action="delete" data-id="${u.id}" data-email="${escapeHtml(u.email)}" ${u.id === currentUser.id ? 'disabled' : ''}>Delete</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('create-msg');
      msg.className = 'msg'; msg.textContent = '';
      try {
        const email = document.getElementById('new-email').value.trim();
        const password = document.getElementById('new-password').value;
        const role = document.getElementById('new-role').value;
        const expiry = document.getElementById('new-expiry').value;
        await window.api.createUser({
          email, password, role,
          accessExpiresAt: expiry ? new Date(expiry + 'T23:59:59').toISOString() : null,
        });
        msg.className = 'msg ok'; msg.textContent = 'User created.';
        e.target.reset();
        await loadUsers();
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = err.message;
      }
    });

    document.querySelector('#users-table').addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      try {
        if (action === 'revoke') {
          if (!confirm('Kick this user out of all active sessions?')) return;
          await window.api.revokeSessions(id);
        } else if (action === 'delete') {
          const email = btn.dataset.email || 'this user';
          const warning =
            'Permanently delete ' + email + '?\n\n' +
            'This CANNOT be undone. The user will be logged out, their account will be removed, ' +
            'and ALL of their saved RAMS records will be deleted.\n\n' +
            'Their email address will become free for re-use.';
          if (!confirm(warning)) return;
          await window.api.deleteUser(id);
        } else if (action === 'reactivate') {
          await window.api.updateUser(id, { isActive: true });
        } else if (action === 'save-expiry') {
          const input = document.querySelector(`.expiry-input[data-id="${id}"]`);
          const value = input.value;
          await window.api.updateUser(id, {
            accessExpiresAt: value ? new Date(value + 'T23:59:59').toISOString() : null,
          });
        }
        await loadUsers();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await window.api.logout().catch(() => {});
      window.location.href = 'index.html';
    });

    bootstrap();
  </script>
</body>
</html>
